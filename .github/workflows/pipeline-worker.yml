name: Pipeline Worker

on:
  schedule:
    # Run every 15 minutes to process heavy stages
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  pipeline-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest runners ship FFmpeg
      - name: Verify FFmpeg
        run: ffmpeg -version | head -1

      - name: Run pipeline worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STOCK_MEDIA_PROVIDER: ${{ vars.STOCK_MEDIA_PROVIDER }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DEFAULT_VOICE: ${{ vars.DEFAULT_VOICE }}
          TTS_CONCURRENCY: ${{ vars.TTS_CONCURRENCY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REDIRECT_URI: ${{ vars.YOUTUBE_REDIRECT_URI }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES }}
          WORKER_POLL_INTERVAL_MS: ${{ vars.WORKER_POLL_INTERVAL_MS }}
          WORKER_MAX_JOBS: ${{ vars.WORKER_MAX_JOBS }}
        run: npx tsx scripts/worker.ts --mode=worker
